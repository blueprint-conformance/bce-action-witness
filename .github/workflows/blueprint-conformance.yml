name: blueprint conformance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: blueprint-conformance/bce@0e0b022a20e458f77118c5adb210e5e26e5a6e82
        with:
          engine: local
          repo: .
          comment: "false"
      - name: Install the exact source-pinned consumer engine
        run: npm ci
      - name: Doctor must confirm coherent authenticated adoption
        run: npx --no-install bce doctor --repo .
