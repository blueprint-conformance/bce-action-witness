name: blueprint conformance
on: [pull_request]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: blueprint-conformance/bce@e47d778cf549ce88fc83dfc57dd59bd18cc79eac
        with:
          engine: local
          repo: .
          comment: "false"
